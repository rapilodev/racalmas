<link href="css/user-stats.css" rel="preload" as="style" onload="this.rel='stylesheet'">
<script src="js/user-stats.js" type="text/javascript" defer></script>

<main id="content"
    data-js-init="calcms.init_user_stats"
    title="<TMPL_VAR .loc.title>"
    data-region="<TMPL_VAR loc.region escape=js>"
>
<div class="sidebar">

    <button
        onclick="loadUrl('user-stats.cgi?project_id=<TMPL_VAR .project_id>&studio_id=<TMPL_VAR .studio_id>&action=show-user-stats')"
     >
        <sprite-icon name="accounts"></sprite-icon>
        <TMPL_VAR .loc.button_show_user_stats>
    </button>
    <button
        onclick="loadUrl('user-stats.cgi?project_id=<TMPL_VAR .project_id>&studio_id=<TMPL_VAR .studio_id>&action=show-active-users');"
     >
        <sprite-icon name="activity"></sprite-icon>
        <TMPL_VAR .loc.button_show_active_users>
    </button>
</div>

<div class="panel scrollable">
    <table id="user_stats_table">
        <thead>
            <tr>
                <th><TMPL_VAR loc.label_user></th>
                <th><TMPL_VAR loc.label_score></th>
                <th><TMPL_VAR loc.label_modified_at></th>
                <th><TMPL_VAR loc.label_create_events></th>
                <th><TMPL_VAR loc.label_update_events></th>
                <th><TMPL_VAR loc.label_delete_events></th>
                <th><TMPL_VAR loc.label_create_series></th>
                <th><TMPL_VAR loc.label_update_series></th>
                <th><TMPL_VAR loc.label_delete_series></th>
            </tr>
        </thead>
        <tbody>
            <TMPL_LOOP user_stats>
            <tr>
                <td><TMPL_VAR user></td>
                <td><TMPL_VAR score></td>
                <td><TMPL_VAR modified_at></td>
                <td><TMPL_VAR create_events></td>
                <td><TMPL_VAR update_events></td>
                <td><TMPL_VAR delete_events></td>
                <td><TMPL_VAR create_series></td>
                <td><TMPL_VAR update_series></td>
                <td><TMPL_VAR delete_series></td>
            </tr>
            </TMPL_LOOP>
        </tbody>
    </table>
</div>
</main>
</body>
</html>
